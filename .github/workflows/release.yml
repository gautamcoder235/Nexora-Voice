name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Release Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Enable Windows Long Paths
        run: git config --system core.longpaths true

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexora Voice Studio ${{ github.ref_name }}'
          releaseBody: 'See the release notes and commit history for details on what is new in ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
