name: 💡 Feature Request
description: Suggest an idea or enhancement for Nexora Voice
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea to make Nexora Voice better!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: A clear description of how the feature should behave...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Any alternative solutions or workarounds you've thought of?
      placeholder: Alternatively, we could...

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, screenshots, or additional info.
