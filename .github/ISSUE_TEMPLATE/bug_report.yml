name: 🐛 Bug Report
description: Create a report to help us fix an issue with Nexora Voice
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the sections below so we can diagnose and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open Nexora Voice Studio
        2. Press hotkey 'Ctrl+Alt+V'
        3. Speak into microphone...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected text to type into active editor...
    validations:
      required: true

  - type: dropdown
    id: model_profile
    attributes:
      label: Active Whisper Model
      description: Which model profile were you using?
      options:
        - "Balanced (Multilingual) - Large-v3 Turbo"
        - "Fast (English) - Distil-Whisper Large-v3"
        - "Lightweight (English) - Whisper Small"
        - "Other / Custom"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Windows OS version, GPU model, and audio input device.
      placeholder: Windows 11 23H2, NVIDIA RTX 3060, USB Headset Mic
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / Terminal Logs (if applicable)
      description: Any error messages from terminal or console.
      render: shell
