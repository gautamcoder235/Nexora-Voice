[workspace]

[package]
name = "tauri-app"
version = "0.1.0"
description = "Private, low-latency offline voice-to-text desktop studio powered by Whisper & Vulkan GPU acceleration"
authors = ["Gautam Sharma"]
license = "MIT"
repository = "https://github.com/gautamcoder235/Nexora-Voice"
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15.3"
hound = "3.5.1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
enigo = "0.2.0"
arboard = "3.4.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
futures-util = "0.3.32"
tauri-plugin-autostart = "2"

